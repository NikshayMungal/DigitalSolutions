<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Solutions - Services & Market Rates</title>
    <style>
        :root {
            --bg-color: #050b14;
            --card-bg: #0a1424;
            --gold-gradient: linear-gradient(135deg, #f1c40f 0%, #d4ac0d 50%, #b7950b 100%);
            --text-light: #ffffff;
            --text-muted: #a0aec0;
            --border-color: rgba(241, 196, 15, 0.2);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-light);
            line-height: 1.6;
        }

        /* Header & Navigation */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 8%;
            background: rgba(5, 11, 20, 0.95);
            border-bottom: 1px solid var(--border-color);
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .logo-container {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .logo-symbol {
            width: 40px;
            height: 40px;
            background: var(--gold-gradient);
            mask: url("data:image/svg+xml,%3Csvg viewBox='0 0 24 24' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M12 2h2v6h6v2h-6v6h6v2h-6v6h-2v-6H6v-2h6V10H6V8h6V2z'/%3E%3C/svg%3E") no-repeat center;
            -webkit-mask: url("data:image/svg+xml,%3Csvg viewBox='0 0 24 24' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M12 2h2v6h6v2h-6v6h6v2h-6v6h-2v-6H6v-2h6V10H6V8h6V2z'/%3E%3C/svg%3E") no-repeat center;
        }

        .logo-text h1 {
            font-size: 1.2rem;
            letter-spacing: 2px;
            background: var(--gold-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: 800;
        }

        .logo-text p {
            font-size: 0.55rem;
            letter-spacing: 1px;
            color: var(--text-muted);
            text-transform: uppercase;
        }

        nav ul {
            display: flex;
            list-style: none;
            gap: 30px;
            align-items: center;
        }

        nav a {
            text-decoration: none;
            color: var(--text-light);
            font-weight: 600;
            font-size: 0.95rem;
            transition: color 0.3s ease;
        }

        nav a.active, nav a:hover {
            color: #f1c40f;
        }

        /* Consultation Button Styling */
        .cta-button {
            background: var(--gold-gradient);
            color: #050b14 !important;
            padding: 10px 20px;
            border-radius: 4px;
            font-weight: 700;
            transition: opacity 0.3s ease, transform 0.2s ease;
        }

        .cta-button:hover {
            opacity: 0.9;
            transform: translateY(-1px);
        }

        /* Services Content Section */
        .services-container {
            max-width: 1200px;
            margin: 60px auto;
            padding: 0 20px;
        }

        .services-header {
            text-align: center;
            margin-bottom: 40px;
        }

        .services-header h2 {
            font-size: 2.3rem;
            background: var(--gold-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 10px;
        }

        .services-header p.sub {
            color: var(--text-muted);
            font-style: italic;
            font-size: 0.9rem;
            letter-spacing: 0.5px;
        }

        /* Table Layout */
        .table-responsive {
            overflow-x: auto;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: center;
        }

        th, td {
            padding: 14px 18px;
            border-bottom: 1px solid rgba(241, 196, 15, 0.1);
        }

        th {
            background-color: #070e1b;
            color: #f1c40f;
            text-transform: uppercase;
            font-size: 0.8rem;
            letter-spacing: 1px;
            border-bottom: 1px solid var(--border-color);
        }

        td {
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        td:first-child, th:first-child {
            text-align: left;
            color: var(--text-light);
            font-weight: 600;
        }

        td:last-child {
            font-weight: bold;
            color: #f1c40f;
        }

        tbody tr:nth-child(even) {
            background-color: rgba(241, 196, 15, 0.015);
        }

        tr:hover td {
            background-color: rgba(241, 196, 15, 0.04);
            color: var(--text-light);
        }

        /* Footer */
        <footer>
            <p>&copy; 2026 Digital Solutions. All Rights Reserved.</p>
        </footer>

</body>
</html>
